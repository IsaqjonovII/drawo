<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Drawo</title>
    <link rel="icon" href="./drawo-logo.png" />
    <style>
      html,body,#root{margin:0;height:100%;width:100%;overflow:hidden;background:#fff}
      /* Drawo UI font: clean native stack (no network). Menus portal to <body>,
         so cover body and all tldraw UI classes. Canvas shape fonts are unaffected. */
      body,.tl-container,[class^="tlui-"],[class*=" tlui-"]{
        font-family:"Inter Variable","Inter","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif !important;
      }
      /* Canvas shape fonts: system/Noto stack only. No Google, no font downloads. */
      .tl-container{
        --tl-font-draw:"Segoe Print","Comic Sans MS","Noto Sans",system-ui,sans-serif !important;
        --tl-font-sans:"Noto Sans","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif !important;
        --tl-font-serif:"Noto Serif",Georgia,"Times New Roman",serif !important;
        --tl-font-mono:"Cascadia Code",Consolas,"Noto Sans Mono",ui-monospace,monospace !important;
      }
      /* hide third-party watermark (personal local use) */
      .tl-watermark_SEE-LICENSE,[class*="watermark" i]{display:none!important}
      /* ---- Drawo theme ---- */
      :root, .tl-container { --color-selected: #8B1FE0 !important; --color-primary: #8B1FE0 !important; --color-focus: #8B1FE0 !important; }
      /* round + soften the floating UI panels, drop hard borders */
      .tlui-layout .tlui-menu-zone,
      .tlui-layout .tlui-navigation-zone > *,
      .tlui-toolbar__tools,
      .tlui-style-panel,
      .tlui-menu,
      .tlui-popover__content,
      .tlui-helper-buttons > * {
        border-radius: 12px !important;
        box-shadow: 0 6px 24px rgba(16,18,26,0.12) !important;
        border: none !important;
      }
      /* square-grid line colors (GPU CSS grid) */
      .drawo-grid { --drawo-grid-minor: rgba(0,0,0,0.045); --drawo-grid-major: rgba(0,0,0,0.09); }
      .tl-theme__dark .drawo-grid, [data-color-mode="dark"] .drawo-grid { --drawo-grid-minor: rgba(255,255,255,0.05); --drawo-grid-major: rgba(255,255,255,0.09); }
      /* board pill (top-left) */
      .drawo-menupanel { display: flex; align-items: center; gap: 4px; padding: 3px 8px 3px 4px; }
      .drawo-logo { width: 26px; height: 26px; object-fit: contain; user-select: none; }
      .drawo-name { font-weight: 600; font-size: 14px; color: var(--color-text); margin: 0 6px 0 2px; white-space: nowrap; }
      /* left vertical tool rail (own fixed element; neutralize tldraw's toolbar wrapper) */
      .tlui-toolbar { position: static !important; background: none !important; box-shadow: none !important; border: none !important; }
      .tlui-toolbar .tlui-toolbar__inner, .tlui-toolbar .tlui-toolbar__tools { background: none !important; box-shadow: none !important; border: none !important; }
      .drawo-rail { position: fixed; left: 16px; top: 50%; transform: translateY(-50%); z-index: 400; display: flex; flex-direction: column; gap: 4px; padding: 6px; background: var(--color-panel); border-radius: 16px; box-shadow: 0 6px 24px rgba(16,18,26,0.12); pointer-events: all; }
      .drawo-rail-btn { width: 44px !important; height: 44px !important; border-radius: 10px !important; color: var(--color-text-3) !important; }
      .drawo-rail-btn:hover { background: color-mix(in srgb, var(--color-text) 6%, transparent) !important; }
      .drawo-rail-btn.active { background: color-mix(in srgb, #8B1FE0 14%, transparent) !important; color: #8B1FE0 !important; }
      /* share panel (top-right) */
      .drawo-sharepanel { display: flex; align-items: center; gap: 10px; padding: 3px 8px; }
      .drawo-avatar { width: 30px; height: 30px; border-radius: 50%; background: #8B1FE0; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; }
      .drawo-share-btn { display: flex; align-items: center; gap: 7px; height: 34px; padding: 0 14px; border: none; border-radius: 9px; background: #8B1FE0; color: #fff; font-family: inherit; font-weight: 600; font-size: 14px; cursor: pointer; }
      .drawo-share-btn:hover { background: #7A17C9; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
